services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=telemetry_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Anropar /health inifrån containern. Klarar 200 = healthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - frontend
      - backend

  tests:
    image: schemathesis/schemathesis:latest
    command: run http://api:5000/openapi.json --phases examples,coverage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data: